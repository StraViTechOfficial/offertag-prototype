<!doctype html>
<html lang="en" class="theme">
<head>
<script>(function(){var d=document.documentElement,admin=d.classList.contains('admin'),k=admin?'adm-theme':'ot-theme',def=admin?'dark':'auto',p;
try{p=localStorage.getItem(k)}catch(e){}if(p!=='light'&&p!=='dark'&&p!=='auto')p=def;
var m=window.matchMedia('(prefers-color-scheme: dark)');
function apply(){var t=p==='auto'?(m.matches?'dark':'light'):p;d.dataset.theme=t;d.dataset.themePref=p;d.style.colorScheme=t;
var c=document.querySelector('meta[name=theme-color]');if(c)c.content=t==='dark'?(admin?'#0a0f1d':'#0b111f'):(admin?'#0a0f1d':'#ffffff');
var bs=document.querySelectorAll('[data-theme-set]');for(var i=0;i<bs.length;i++)bs[i].setAttribute('aria-checked',bs[i].getAttribute('data-theme-set')===p?'true':'false');
var f=document.querySelectorAll('[data-theme-flip]');for(var q=0;q<f.length;q++)f[q].setAttribute('aria-label',t==='dark'?'Switch to light theme':'Switch to dark theme');
var em=document.querySelectorAll('emoji-picker');for(var j=0;j<em.length;j++)em[j].className=t;}
apply();if(m.addEventListener)m.addEventListener('change',function(){if(p==='auto')apply()});
window.OTTheme={get:function(){return p},set:function(v){p=v;try{localStorage.setItem(k,v)}catch(e){}apply();
var n={light:'Light',dark:'Dark',auto:'Automatic'}[v];if(window.OT&&OT.toast)OT.toast('Theme: '+n,v==='dark'?'moon':v==='light'?'sun':'sun-moon');}};
document.addEventListener('click',function(e){var f=e.target.closest&&e.target.closest('[data-theme-flip]');if(f){e.preventDefault();window.OTTheme.set(d.dataset.theme==='dark'?'light':'dark');return}var b=e.target.closest&&e.target.closest('[data-theme-set]');if(!b)return;e.preventDefault();window.OTTheme.set(b.getAttribute('data-theme-set'))});
document.addEventListener('DOMContentLoaded',apply);
window.addEventListener('storage',function(e){if(e.key===k&&e.newValue){p=e.newValue;apply()}});})();</script>
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in — OfferTag</title>
<link rel="stylesheet" href="/vendor/geist/geist.css">
<link rel="stylesheet" href="/css/ui.css">
<link rel="stylesheet" href="/css/site.css">
<link rel="stylesheet" href="/css/theme.css">
</head>
<body data-page="login" class="is-focus">


<main class="auth-main"><div class="auth-card">
  <a class="btn btn-ghost btn-icon auth-back" href="/" data-back aria-label="Back"><i data-lucide="chevron-left"></i></a>
  <a class="auth-logo" href="/" aria-label="OfferTag home"><img src="/assets/logo.png" alt="OfferTag"></a>
  <div class="signin" data-signin>
  <div class="signin-head"><h1 class="auth-title" data-signin-title>Sign in</h1><p class="signin-sub" data-signin-sub>New here? Signing in creates your account.</p></div>
  <div class="signin-step" data-step="start">
    <form class="signin-form" data-email-form novalidate>
      <label class="field-label">Email<input class="input" type="email" name="email" inputmode="email" autocomplete="email" maxlength="255" placeholder="you@example.com"></label>
      <p class="form-error" data-email-error role="alert" hidden></p>
      <label class="turnstile" data-turnstile hidden><input type="checkbox" data-turnstile-box><span>Verify you are human</span><small>Cloudflare Turnstile</small></label>
      <button class="btn btn-default" type="submit">Send code</button>
    </form>
    <p class="signin-legal">By continuing you agree to the <a href="/terms">Terms</a> and <a href="/privacy">Privacy policy</a>.</p>
  </div>
  <div class="signin-step" data-step="code" hidden>
    <div class="otp" role="group" aria-label="6-digit code"><input class="input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 1" autocomplete=one-time-code><input class="input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 2" autocomplete=off><input class="input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 3" autocomplete=off><input class="input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 4" autocomplete=off><input class="input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 5" autocomplete=off><input class="input" type="text" inputmode="numeric" pattern="[0-9]*" aria-label="Digit 6" autocomplete=off></div>
    <p class="form-error" data-code-error role="alert" hidden></p>
    <p class="signin-help">Valid for 10 minutes</p>
    <button class="btn btn-link signin-resend" type="button" data-resend disabled>Resend code in 0:30</button>
  </div>
</div>
  <p class="auth-returning"><i data-lucide="info"></i>Used OfferTag before? Sign in once more with a code sent to your email. Your account and comments are safe.</p>
</div></main>



<script src="/vendor/lucide.min.js"></script>
<script src="/js/db.js"></script>
<script src="/js/render.js"></script>
<script src="/js/admin-db.js"></script>
<script type="ot/defer" data-src="/js/theme.js"></script>
<script type="ot/defer" data-src="/js/site.js"></script>
</body>
</html>
